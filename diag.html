<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>精确诊断：为什么请求失败</title>
<style>body{font-family:system-ui;max-width:600px;margin:0 auto;padding:15px;background:#fafafa}h2{font-size:18px}button{padding:10px 18px;background:#ff6b35;color:#fff;border:none;border-radius:6px;font-weight:600;font-size:14px}pre{background:#1e1e1e;color:#d4d4d4;padding:10px;border-radius:6px;overflow:auto;font-size:11px;white-space:pre-wrap;max-height:300px}.ok{color:#16a34a;font-weight:600}.fail{color:#dc2626;font-weight:600}.box{background:#fff;border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:8px}</style>
</head><body>

<h2>🔍 精确诊断</h2>
<p style="font-size:12px;color:#888">手机点按钮，每一步告诉我精确结果，帮你定位问题</p>

<div class="box"><h3>① 先查小蚕域名 DNS 解析</h3>
<button onclick="checkDns()">测试 DNS</button>
<pre id="dnsResult" style="display:none"></pre></div>

<div class="box"><h3>② 测能不能连上小蚕 HTTPS（IPv4 vs IPv6）</h3>
<button onclick="testConnect()">测试连接</button>
<pre id="connResult" style="display:none"></pre></div>

<div class="box"><h3>③ 测出口 IP（确认走 IPv4 还是 IPv6）</h3>
<button onclick="testIp()">查出口 IP</button>
<div id="ipResult"></div></div>

<div class="box"><h3>④ 最终诊断：带签名发真实请求</h3>
<button onclick="testSigned()">带签名 POST</button>
<pre id="signResult" style="display:none"></pre></div>

<script>
const GW = 'https://gw.xiaocantech.com/rpc';
const TEST_TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJVc2VySWQiOjIyNDI5Mzc0LCJleHAiOjE3OTQ3NTY3ODZ9.KR1y7s36OcTIjoQv0GOS5Bymy9DL_rFDCed9lL87PvM';

// --- 极简 MD5 ---
function md5(s){function safe(a,b){var c=(a&0xFFFF)+(b&0xFFFF);return(((a>>16)+(b>>16)+(c>>16))<<16)|(c&0xFFFF)}function rol(n,c){return(n<<c)|(n>>>(32-c))}function cmn(q,a,b,x,s,t){return safe(rol(safe(safe(a,q),safe(x,t)),s),b)}function ff(a,b,c,d,x,s,t){return cmn((b&c)|((~b)&d),a,b,x,s,t)}function gg(a,b,c,d,x,s,t){return cmn((b&d)|(c&(~d)),a,b,x,s,t)}function hh(a,b,c,d,x,s,t){return cmn(b^c^d,a,b,x,s,t)}function ii(a,b,c,d,x,s,t){return cmn(c^(b|(~d)),a,b,x,s,t)}function core(x,len){x[len>>5]|=0x80<<((len)%32);x[(((len+64)>>>9)<<4)+14]=len;var a=1732584193,b=-271733879,c=-1732584194,d=271733878;for(var i=0;i<x.length;i+=16){var o=a,p=b,q=c,r=d;a=ff(a,b,c,d,x[i+0],7,-680876936);d=ff(d,a,b,c,x[i+1],12,-389564586);c=ff(c,d,a,b,x[i+2],17,606105819);b=ff(b,c,d,a,x[i+3],22,-1044525330);a=ff(a,b,c,d,x[i+4],7,-176418897);d=ff(d,a,b,c,x[i+5],12,1200080426);c=ff(c,d,a,b,x[i+6],17,-1473231341);b=ff(b,c,d,a,x[i+7],22,-45705983);a=ff(a,b,c,d,x[i+8],7,1770035416);d=ff(d,a,b,c,x[i+9],12,-1958414417);c=ff(c,d,a,b,x[i+10],17,-42063);b=ff(b,c,d,a,x[i+11],22,-1990404162);a=ff(a,b,c,d,x[i+12],7,1804603682);d=ff(d,a,b,c,x[i+13],12,-40341101);c=ff(c,d,a,b,x[i+14],17,-1502002290);b=ff(b,c,d,a,x[i+15],22,1236535329);a=gg(a,b,c,d,x[i+1],5,-165796510);d=gg(d,a,b,c,x[i+6],9,-1069501632);c=gg(c,d,a,b,x[i+11],14,643717713);b=gg(b,c,d,a,x[i+0],20,-373897302);a=gg(a,b,c,d,x[i+5],5,-701558691);d=gg(d,a,b,c,x[i+10],9,38016083);c=gg(c,d,a,b,x[i+15],14,-660478335);b=gg(b,c,d,a,x[i+4],20,-405537848);a=gg(a,b,c,d,x[i+9],5,568446438);d=gg(d,a,b,c,x[i+14],9,-1019803690);c=gg(c,d,a,b,x[i+3],14,-187363961);b=gg(b,c,d,a,x[i+8],20,1163531501);a=gg(a,b,c,d,x[i+13],5,-1444681467);d=gg(d,a,b,c,x[i+2],9,-51403784);c=gg(c,d,a,b,x[i+7],14,1735328473);b=gg(b,c,d,a,x[i+12],20,-1926607734);a=hh(a,b,c,d,x[i+5],4,-378558);d=hh(d,a,b,c,x[i+8],11,-2022574463);c=hh(c,d,a,b,x[i+11],16,1839030562);b=hh(b,c,d,a,x[i+14],23,-35309556);a=hh(a,b,c,d,x[i+1],4,-1530992060);d=hh(d,a,b,c,x[i+4],11,1272893353);c=hh(c,d,a,b,x[i+7],16,-155497632);b=hh(b,c,d,a,x[i+10],23,-1094730640);a=hh(a,b,c,d,x[i+13],4,681279174);d=hh(d,a,b,c,x[i+0],11,-35853722);c=hh(c,d,a,b,x[i+3],16,-722521979);b=hh(b,c,d,a,x[i+6],23,76029189);a=hh(a,b,c,d,x[i+9],4,-640364487);d=hh(d,a,b,c,x[i+12],11,-421815835);c=hh(c,d,a,b,x[i+15],16,530742520);b=hh(b,c,d,a,x[i+2],23,-995338651);a=ii(a,b,c,d,x[i+0],6,-198630844);d=ii(d,a,b,c,x[i+7],10,1126891415);c=ii(c,d,a,b,x[i+14],15,-1416354905);b=ii(b,c,d,a,x[i+5],21,-57434055);a=ii(a,b,c,d,x[i+12],6,1700485571);d=ii(d,a,b,c,x[i+3],10,-1894986606);c=ii(c,d,a,b,x[i+10],15,-1051523);b=ii(b,c,d,a,x[i+1],21,-2054922799);a=ii(a,b,c,d,x[i+8],6,1873313359);d=ii(d,a,b,c,x[i+15],10,-30611744);c=ii(c,d,a,b,x[i+6],15,-1560198380);b=ii(b,c,d,a,x[i+13],21,1309151649);a=ii(a,b,c,d,x[i+4],6,-145523070);d=ii(d,a,b,c,x[i+11],10,-1120210379);c=ii(c,d,a,b,x[i+2],15,718787259);b=ii(b,c,d,a,x[i+9],21,-343485551);a=ii(a,b,c,d,x[i+14],6,-798955658);d=ii(d,a,b,c,x[i+5],10,-343485551);c=ii(c,d,a,b,x[i+12],15,755456052);b=ii(b,c,d,a,x[i+1],21,-1895863544);a=safe(a,o);b=safe(b,p);c=safe(c,q);d=safe(d,r)}function hex(n){var h="",v,j;for(j=0;j<=3;j++){v=(n>>(j*8+4))&0x0F;h+=v.toString(16);v=(n>>(j*8))&0x0F;h+=v.toString(16)}return h}function utf8(s){return unescape(encodeURIComponent(s))}var blks=new Array(((utf8(s).length+8)>>6)+1);for(var i=0;i<blks.length;i++)blks[i]=0;for(i=0;i<utf8(s).length;i++)blks[i>>2]|=(utf8(s).charCodeAt(i)&0xFF)<<((i%4)*8);blks[i>>2]|=0x80<<((i%4)*8);blks[blks.length-2]=utf8(s).length*8;var r=core(blks,utf8(s).length*8);return hex(r[0])+hex(r[1])+hex(r[2])+hex(r[3])}
function getAshe(t,s,m,n){return md5(md5((s+"."+m).toLowerCase())+t+n)}

// --- 诊断 1: DNS（浏览器无法直接查 DNS，用第三方接口测 ---
async function checkDns(){const pre=document.getElementById('dnsResult');pre.style.display='block';pre.textContent='测试中...';try{const r=await fetch('https://dns.google/resolve?name=gw.xiaocantech.com&type=A');const d=await r.json();const a=(d.Answer||[]).map(x=>x.data);let text=`A 记录（IPv4）: ${a.length?a.join(', '):'无'}\n`;try{const r2=await fetch('https://dns.google/resolve?name=gw.xiaocantech.com&type=AAAA');const d2=await r2.json();const aaaa=(d2.Answer||[]).map(x=>x.data);text+=`AAAA 记录（IPv6）: ${aaaa.length?aaaa.join(', '):'无'}`;}catch(e){text+=`AAAA 查询失败: ${e.message}`}pre.textContent=text}catch(e){pre.textContent=`DNS 查询失败: ${e.message}`}}

// --- 诊断 2: 先试 OPTIONS 预检（小蚕对 OPTIONS 总是放行的） ---
async function testConnect(){const pre=document.getElementById('connResult');pre.style.display='block';pre.textContent='测试中...';try{const t0=Date.now();const r=await fetch(GW,{method:'OPTIONS',headers:{'Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'content-type,x-sivir,x-ashe,x-garen,x-nami'}});const t1=Date.now();const cors=r.headers.get('access-control-allow-origin');pre.textContent=`OPTIONS 预检结果:\n  HTTP: ${r.status}\n  耗时: ${t1-t0}ms\n  Access-Control-Allow-Origin: ${cors||'❌ 无'}\n\n${r.status===200?'✅ 浏览器能连上小蚕（走的是 IPv4！）':'❌ 连接有问题'}`}catch(e){pre.textContent=`❌ 连不上小蚕网关！\n错误: ${e.name} ${e.message}\n\n这说明你手机浏览器还是在尝试 IPv6 连接，但小蚕没有 IPv6 监听。\n\n👉 请确认:\n1. 手机关掉 IPv6（APN 设置里选 IPv4  only）\n2. 或者换浏览器（Via / 夸克 等轻量浏览器）\n3. 或者告诉我你手机型号，我给具体操作步骤`}}

// --- 诊断 3: 出口 IP ---
async function testIp(){const div=document.getElementById('ipResult');div.textContent='查询中...';const srcs=['https://api.ipify.org?format=json','https://ifconfig.me/all.json','https://checkip.amazonaws.com/'];for(const u of srcs){try{const r=await fetch(u);if(!r.ok)continue;let ip='';const ct=r.headers.get('content-type')||'';if(ct.includes('json')){const d=await r.json();ip=d.ip||d.origin||Object.values(d)[0]||''}else{ip=(await r.text()).trim()}if(ip){const isV6=ip.includes(':');div.innerHTML=`出口 IP: <b class="${isV6?'fail':'ok'}">${ip}</b>  ${isV6?'<span style="color:#dc2626">❌ 这是 IPv6！小蚕不支持</span>':'<span style="color:#16a34a">✅ 这是 IPv4，可以用！</span>'}<br><br><b>关键问题:</b> ${isV6?'你的手机运营商默认用 IPv6 优先，请手动关掉':'出口 IP 是 IPv4，没问题，继续测下一步'}`;return}}catch(e){}}div.innerHTML='所有 IP 查询源都失败了'}

// --- 诊断 4: 带签名 POST ---
async function testSigned(){const pre=document.getElementById('signResult');pre.style.display='block';pre.textContent='测试中...';const t=Date.now();const n=crypto.randomUUID();const headers={'x-City':'440303','X-Garen':String(t),'X-Nami':n,'x-Annie':'XC','servername':'Silkworm','methodname':'SilkwormService.GetClientUserInfo','X-Ashe':getAshe(t,'Silkworm','SilkwormService.GetClientUserInfo',n),'Content-Type':'application/json','Authorization':'Bearer '+TEST_TOKEN,'x-Sivir':TEST_TOKEN,'X-Platform':'Android','appid':'10','version':'3.21.1','User-Agent':'XiaoCan/3.21.1 Mobile okhttp/4.12.0'};const body={silk_id:0,page_pv_id:Math.random().toString(36).slice(2),app_id:10};try{const t0=Date.now();const r=await fetch(GW,{method:'POST',headers,body:JSON.stringify(body)});const t1=Date.now();if(r.status===200){const d=await r.json();if(d.status&&d.status.code===0){pre.textContent=`✅✅✅ 成功！\nHTTP: 200\n耗时: ${t1-t0}ms\n\n前端直连完全可行！！！\n\n返回数据: ${JSON.stringify(d.user_info||{}).slice(0,200)}`}else{pre.textContent=`HTTP 200 但业务错误\nstatus: ${JSON.stringify(d.status)}\n完整: ${JSON.stringify(d).slice(0,300)}`}}else if(r.status===403){const ct=r.headers.get('content-type')||'';const cors=r.headers.get('access-control-allow-origin');const text=await r.text();pre.textContent=`❌ WAF 403（被标记了）\nHTTP: 403\nCORS头: ${cors||'无'}\n响应头 server: ${r.headers.get('server')||'未知'}\n\n关键: ${cors?'✅ 有 CORS 头 —— 是 WAF 真的拦了，不是跨域问题':'❌ 无 CORS 头 —— 这是边缘层直接拦（未带签名请求的 403）'}\n\n响应内容: ${text.slice(0,200)}`}}else{const text=await r.text();pre.textContent=`HTTP ${r.status}\n${text.slice(0,200)}`}}catch(e){pre.textContent=`❌ 网络异常: ${e.name} ${e.message}\n\n👉 这几乎确定是 IPv6 连接问题\n👉 请关掉手机 IPv6（见上面诊断 2 的提示）`}}
</script>
</body></html>
